<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Las mejores criptos, ordenadas a 90 días</title>
<meta name="description" content="Tabla de las 100 mayores criptos con 1 h, 24 h, 7 d, 30 d y 90 días, volumen y capitalización. Pincha en cada columna para ordenar. Sin estables ni publicidad.">
<meta name="theme-color" content="#0d1117">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#232a33;--txt:#f2f4f7;--mut:#8b949e;--or:#FF6700;--up:#2ee06f;--dn:#ff4d5e;--pad:clamp(10px,2.5vw,36px);
 --row:#0f141b;--row2:#12171e;--rkw:58px;--coinw:240px}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:var(--bg)}
body{font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--txt);-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;
 display:flex;flex-direction:column;height:100vh;height:100dvh;overflow:hidden;-webkit-tap-highlight-color:transparent}
header{flex:none;padding:calc(var(--pad)*.7) var(--pad) clamp(10px,1.4vw,20px);display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px 20px}
h1{font-size:clamp(30px,4.4vw,64px);font-weight:900;letter-spacing:-.02em;line-height:1}
h1 span{color:var(--or)}
.sub{font-size:clamp(14px,1.6vw,24px);font-weight:600;color:var(--mut);margin-top:8px}
.sub b{color:var(--txt)}
.grp{display:flex;gap:clamp(5px,.7vw,10px);flex-wrap:wrap}
.btn{font:inherit;font-size:clamp(14px,1.6vw,24px);font-weight:800;color:var(--txt);background:var(--card);border:2px solid #2a313b;border-radius:12px;
 padding:clamp(6px,.7vw,10px) clamp(10px,1.4vw,22px);cursor:pointer;white-space:nowrap;touch-action:manipulation;transition:background .2s,border-color .2s,color .2s}
.btn:hover{border-color:#4a5360}
.btn.on{background:var(--or);border-color:var(--or);color:#000}
.box{flex:1;min-height:0;margin:0 var(--pad);overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:16px;border:1px solid var(--line);background:var(--row);
 scrollbar-width:thin;scrollbar-color:#30363d transparent}
.box::-webkit-scrollbar{width:10px;height:10px}.box::-webkit-scrollbar-thumb{background:#30363d;border-radius:6px}.box::-webkit-scrollbar-corner{background:transparent}
table{width:100%;min-width:1120px;border-collapse:separate;border-spacing:0;table-layout:fixed}
col.c-rk{width:var(--rkw)}col.c-coin{width:var(--coinw)}col.c-pr{width:170px}col.c-p{width:112px}col.c-vol{width:140px}col.c-mc{width:160px}
thead th{position:sticky;top:0;z-index:2;background:var(--card);font-size:clamp(12px,1.05vw,18px);font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--mut);
 padding:clamp(10px,1vw,16px) 8px;text-align:right;border-bottom:2px solid #2a313b;cursor:pointer;user-select:none;-webkit-user-select:none;white-space:nowrap}
thead th:hover{color:var(--txt)}
thead th.act{color:var(--txt)}
thead th .ar{color:var(--or);font-size:.85em;margin-left:5px}
th.l,td.l{text-align:left}
tbody td{font-size:clamp(14px,1.25vw,21px);font-weight:600;padding:0 8px;height:clamp(46px,4.4vw,64px);text-align:right;border-bottom:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--row)}
tbody tr:nth-child(even) td{background:var(--row2)}
tbody tr:hover td{background:#18202a}
/* # y moneda se quedan fijas al desplazar la tabla de lado (móvil) */
.st1,.st2{position:sticky;z-index:1}
.st1{left:0}.st2{left:var(--rkw);border-right:1px solid var(--line)}
thead th.st1,thead th.st2{z-index:3}
td.rk{color:var(--mut);font-weight:700;text-align:center;padding:0 4px;text-overflow:clip}
th.rk{text-align:center}
.coin{display:flex;align-items:center;gap:10px;min-width:0}
.coin img{width:clamp(24px,2.2vw,34px);height:clamp(24px,2.2vw,34px);border-radius:50%;flex:none;background:#222}
.coin .nm{font-weight:800;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.coin .sy{color:var(--mut);font-weight:700;flex:none}
td.pr{font-weight:800}
.u{color:var(--up)}.d{color:var(--dn)}.z{color:var(--mut)}
.u i,.d i{font-style:normal;font-size:.62em;margin-right:3px;position:relative;top:-1px}
footer{flex:none;padding:8px var(--pad) calc(10px + env(safe-area-inset-bottom));font-size:clamp(11px,1.1vw,15px);color:var(--mut);display:flex;justify-content:space-between;flex-wrap:wrap;gap:2px 18px}
footer a{color:var(--mut);text-decoration:underline;text-decoration-color:rgba(139,148,158,.45);text-underline-offset:2px}
footer a:hover{color:var(--txt)}
footer .err{color:#e3b341}
@media (max-width:700px){
 :root{--rkw:38px;--coinw:118px}
 table{min-width:900px}
 col.c-pr{width:118px}col.c-p{width:84px}col.c-vol{width:104px}col.c-mc{width:118px}
 .coin{gap:7px}.coin .nm{display:none}.coin .sy{color:var(--txt);font-weight:800}
 tbody td{padding:0 6px}thead th{padding-left:6px;padding-right:6px}
}
</style>
</head>
<body>
<header>
 <div><h1>Las <span>mejores</span></h1><div class="sub" id="sub">cargando…</div></div>
 <div class="grp" id="top">
  <button class="btn" data-n="10">Top 10</button>
  <button class="btn on" data-n="25">Top 25</button>
  <button class="btn" data-n="50">Top 50</button>
  <button class="btn" data-n="100">Top 100</button>
 </div>
</header>
<div class="box" id="box">
 <table>
  <colgroup><col class="c-rk"><col class="c-coin"><col class="c-pr"><col class="c-p"><col class="c-p"><col class="c-p"><col class="c-p"><col class="c-p"><col class="c-vol"><col class="c-mc"></colgroup>
  <thead><tr id="hd">
   <th class="rk st1" data-k="rank">#</th><th class="l st2" data-k="name">Moneda</th><th data-k="price">Precio</th>
   <th data-k="1h">1 h</th><th data-k="24h">24 h</th><th data-k="7d">7 d</th><th data-k="30d">30 d</th><th data-k="90d">90 d</th>
   <th data-k="vol">Vol. 24 h</th><th data-k="mcap">Capitaliz.</th>
  </tr></thead>
  <tbody id="tb"></tbody>
 </table>
</div>
<footer>
 <span>Datos: <a href="https://www.coingecko.com" target="_blank" rel="noopener">CoinGecko</a> (90 días: Binance) · se actualiza sola cada minuto · <span id="upd"></span></span>
 <span>Hecho con IA por el canal de Rodrigo Arnedo · <a href="https://funontheride.com" target="_blank" rel="noopener">funontheride.com</a></span>
</footer>
<script>
(function(){
'use strict';
/* ---------- Datos ---------- */
var CG='https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=150&page=1&price_change_percentage=1h,24h,7d,30d';
var EXCL=['usdt','usdc','dai','usde','fdusd','tusd','pyusd','usds','usd1','rlusd','susde','busd','wbtc','weth','steth','wsteth','weeth','cbbtc','wbeth','reth','jitosol','bsc-usd',
 /* fondos tokenizados y estables en euros (no son cripto que se mueva) */
 'eurc','usyc','ustb','jaaa','eutbl','eursafo','ousg','buidl','usdy','reusd','figr_heloc'];
function isStable(c){
 var s=(c.symbol||'').toLowerCase(),p=c.current_price,d24=c.price_change_percentage_24h_in_currency,
     d7=c.price_change_percentage_7d_in_currency,d30=c.price_change_percentage_30d_in_currency;
 if(EXCL.indexOf(s)>=0||s.indexOf('usd')===0||s.indexOf('eur')===0)return true;
 if(p>=0.98&&p<=1.02&&d24!=null&&Math.abs(d24)<0.5)return true;
 if(d7!=null&&d30!=null&&Math.abs(d7)<0.5&&Math.abs(d30)<1)return true;
 return false;
}
var coins=[],p90={},lastOk=null,errMsg='';
function shape(c,i){return{id:c.id,sym:(c.symbol||'').toUpperCase(),name:String(c.name||'').replace(/\s*\(.*?\)\s*/g,' ').trim(),img:c.image,price:c.current_price,
 vol:c.total_volume,mcap:c.market_cap,rank:i+1,
 '1h':c.price_change_percentage_1h_in_currency,'24h':c.price_change_percentage_24h_in_currency,
 '7d':c.price_change_percentage_7d_in_currency,'30d':c.price_change_percentage_30d_in_currency};}
function loadMarkets(){
 return fetch(CG).then(function(r){if(!r.ok)throw new Error(r.status===429?'límite de CoinGecko (429)':'CoinGecko '+r.status);return r.json();})
 .then(function(d){coins=d.filter(function(c){return !isStable(c);}).slice(0,100).map(shape);lastOk=new Date();errMsg='';render();})
 .catch(function(e){errMsg=e.message||'sin conexión';stamp();});
}
/* 90 días con velas diarias de Binance: cierre de hoy frente al de hace 90 días */
function load90(){
 var list=coins.slice(),i=0;
 function one(c){
  if(!/^[A-Z0-9]{2,12}$/.test(c.sym))return Promise.resolve();
  return fetch('https://api.binance.com/api/v3/klines?symbol='+c.sym+'USDT&interval=1d&limit=91')
   .then(function(r){return r.ok?r.json():null;})
   .then(function(k){
     if(!k||k.length<91||+k[k.length-1][0]<Date.now()-2*864e5){p90[c.id]=null;return;}  /* par deslistado = velas viejas */
     var a=+k[0][4],b=+k[k.length-1][4];
     /* control: si el precio de Binance no cuadra con CoinGecko, es otra moneda con el mismo símbolo */
     if(!a||!b||!c.price||Math.abs(b/c.price-1)>0.15){p90[c.id]=null;return;}
     p90[c.id]=(b/a-1)*100;
   }).catch(function(){});
 }
 function batch(){
  if(i>=list.length){render();return;}
  var part=list.slice(i,i+8);i+=8;
  Promise.all(part.map(one)).then(function(){render();setTimeout(batch,300);});
 }
 batch();
}

/* ---------- Formato español ---------- */
function grp(s){return s.replace(/\B(?=(\d{3})+(?!\d))/g,'.');}
function num(v,d){var s=Math.abs(v).toFixed(d).split('.');return (v<0?'−':'')+grp(s[0])+(s[1]?','+s[1]:'');}
function fmtPrice(v){if(v==null)return '—';var d=v>=1?2:v>=0.01?4:Math.min(10,Math.max(4,2-Math.floor(Math.log10(v))+2));
 var s=num(v,d);if(v<0.01)s=s.replace(/0+$/,'').replace(/,$/,',00');return s+' $';}
function fmtBig(v){if(v==null||!v)return '—';
 if(v>=1e12)return num(v/1e12,2)+' bill. $';
 if(v>=1e7)return num(Math.round(v/1e6),0)+' M$';
 if(v>=1e6)return num(v/1e6,1)+' M$';
 return num(Math.round(v/1e3),0)+' mil $';}
function fmtPct(v){if(v==null||isNaN(v))return '<span class="z">—</span>';var a=Math.abs(v);
 var s=num(a,a>=100?0:1)+' %';
 if(v>0)return '<span class="u"><i>▲</i>'+s+'</span>';
 if(v<0)return '<span class="d"><i>▼</i>'+s+'</span>';
 return '<span class="z">0,0 %</span>';}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function stamp(){
 var t=lastOk?lastOk.toLocaleTimeString('es-ES',{hour:'2-digit',minute:'2-digit'}):'';
 document.getElementById('upd').innerHTML=(lastOk?'actualizado a las '+t:'')+(errMsg?' · <span class="err">'+esc(errMsg)+', reintento en 60 s</span>':'');
}

/* ---------- Tabla ---------- */
var topN=25,sortK='mcap',sortDir=-1;
var LAB={rank:'#',name:'moneda',price:'precio','1h':'1 h','24h':'24 h','7d':'7 días','30d':'30 días','90d':'90 días',vol:'volumen',mcap:'capitalización'};
function get(c,k){return k==='90d'?p90[c.id]:c[k];}
function render(){
 if(!coins.length)return;
 var rows=coins.slice(0,topN).sort(function(a,b){
  var x=get(a,sortK),y=get(b,sortK);
  if(sortK==='name'){return sortDir*String(x).localeCompare(String(y),'es');}
  var nx=x==null||isNaN(x),ny=y==null||isNaN(y);
  if(nx&&ny)return a.rank-b.rank;if(nx)return 1;if(ny)return -1;   /* sin dato, siempre al final */
  return sortDir*(x-y)||a.rank-b.rank;
 });
 var h='';
 rows.forEach(function(c){
  h+='<tr><td class="rk st1">'+c.rank+'</td>'+
   '<td class="l st2"><div class="coin"><img src="'+esc(c.img)+'" alt="" loading="lazy"><span class="nm">'+esc(c.name)+'</span><span class="sy">'+esc(c.sym)+'</span></div></td>'+
   '<td class="pr">'+fmtPrice(c.price)+'</td>'+
   '<td>'+fmtPct(c['1h'])+'</td><td>'+fmtPct(c['24h'])+'</td><td>'+fmtPct(c['7d'])+'</td><td>'+fmtPct(c['30d'])+'</td><td>'+fmtPct(p90[c.id])+'</td>'+
   '<td>'+fmtBig(c.vol)+'</td><td>'+fmtBig(c.mcap)+'</td></tr>';
 });
 document.getElementById('tb').innerHTML=h;
 Array.prototype.forEach.call(document.querySelectorAll('#hd th'),function(th){
  var on=th.getAttribute('data-k')===sortK,old=th.querySelector('.ar');if(old)old.remove();
  th.classList.toggle('act',on);
  if(on){var s=document.createElement('span');s.className='ar';s.textContent=sortDir<0?'▼':'▲';th.appendChild(s);}
 });
 var dirTxt=sortK==='name'?(sortDir>0?'A → Z':'Z → A'):(sortDir<0?'mayor a menor':'menor a mayor');
 document.getElementById('sub').innerHTML='Las <b>'+topN+'</b> más grandes · por <b>'+LAB[sortK]+'</b>, '+dirTxt;
 stamp();
}
Array.prototype.forEach.call(document.querySelectorAll('#hd th'),function(th){
 th.addEventListener('click',function(){
  var k=th.getAttribute('data-k');
  if(k===sortK)sortDir=-sortDir;else{sortK=k;sortDir=(k==='name'||k==='rank')?1:-1;}
  render();
 });
});
Array.prototype.forEach.call(document.querySelectorAll('#top .btn'),function(b){
 b.addEventListener('click',function(){
  topN=+b.getAttribute('data-n');
  Array.prototype.forEach.call(document.querySelectorAll('#top .btn'),function(x){x.classList.toggle('on',x===b);});
  document.getElementById('box').scrollTop=0;render();
 });
});
/* ---------- Arranque y refresco ---------- */
var last90=0;
loadMarkets().then(function(){if(coins.length){last90=Date.now();load90();}});
setInterval(function(){
 loadMarkets().then(function(){if(coins.length&&Date.now()-last90>30*60*1000){last90=Date.now();load90();}});
},60000);
})();
</script>
</body>
</html>
